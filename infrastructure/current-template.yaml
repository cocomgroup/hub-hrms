"AWSTemplateFormatVersion: '2010-09-09'\nDescription: 'Hub-HRMS Application - ECS Fargate with RDS PostgreSQL, DynamoDB, ALB, S3, and CloudFront'\n\nParameters:\n  Environment:\n    Type: String\n    Default: development\n    AllowedValues:\n      - development\n      - staging\n      - production\n    Description: Environment name\n\n  DBUsername:\n    Type: String\n    Default: postgres\n    Description: Database master username\n    NoEcho: false\n\n  DBPassword:\n    Type: String\n    NoEcho: true\n    MinLength: 8\n    Description: Database master password (min 8 characters)\n\n  DBName:\n    Type: String\n    Default: hrmsdb\n    Description: Database name\n\n  JWTSecret:\n    Type: String\n    NoEcho: true\n    MinLength: 32\n    Description: JWT secret for authentication (min 32 characters)\n\n  BankInfoEncryptionKey:\n    Type: String\n    NoEcho: true\n    MinLength: 32\n    Description: 32-byte encryption key for bank info (must be exactly 32 characters)\n\n  BackendImageURI:\n    Type: String\n    Description: Backend Docker image URI (ECR or Docker Hub)\n    Default: ''\n\n  FrontendImageURI:\n    Type: String\n    Description: Frontend Docker image URI (ECR or Docker Hub)\n    Default: ''\n\n  CertificateArn:\n    Type: String\n    Description: ACM Certificate ARN for HTTPS (optional, recommended for production)\n    Default: ''\n\n  DomainName:\n    Type: String\n    Description: Domain name for the application (e.g., hrms.example.com)\n    Default: ''\n\n  DesiredCount:\n    Type: Number\n    Default: 2\n    MinValue: 1\n    MaxValue: 10\n    Description: Desired number of ECS tasks\n\n  BackendCPU:\n    Type: Number\n    Default: 512\n    AllowedValues: [256, 512, 1024, 2048, 4096]\n    Description: Backend task CPU units (256 = 0.25 vCPU)\n\n  BackendMemory:\n    Type: Number\n    Default: 1024\n    AllowedValues: [512, 1024, 2048, 4096, 8192, 16384]\n    Description: Backend task memory in MB\n\n  FrontendCPU:\n    Type: Number\n    Default: 256\n    AllowedValues: [256, 512, 1024, 2048]\n    Description: Frontend task CPU units\n\n  FrontendMemory:\n    Type: Number\n    Default: 512\n    AllowedValues: [512, 1024, 2048, 4096]\n    Description: Frontend task memory in MB\n\n  DBInstanceClass:\n    Type: String\n    Default: db.t3.micro\n    AllowedValues:\n      - db.t3.micro\n      - db.t3.small\n      - db.t3.medium\n      - db.t3.large\n      - db.r5.large\n      - db.r5.xlarge\n    Description: RDS instance type\n\n  DBAllocatedStorage:\n    Type: Number\n    Default: 20\n    MinValue: 20\n    MaxValue: 1000\n    Description: Database storage in GB\n\n  EnableCloudFront:\n    Type: String\n    Default: 'true'\n    AllowedValues: ['true', 'false']\n    Description: Enable CloudFront CDN for frontend\n\n  EnableAutoScaling:\n    Type: String\n    Default: 'true'\n    AllowedValues: ['true', 'false']\n    Description: Enable auto-scaling for ECS services\n\n  MaxTasks:\n    Type: Number\n    Default: 10\n    MinValue: 1\n    MaxValue: 50\n    Description: Maximum number of tasks for auto-scaling\n\n  MinTasks:\n    Type: Number\n    Default: 1\n    MinValue: 1\n    MaxValue: 10\n    Description: Minimum number of tasks for auto-scaling\n\nConditions:\n  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]\n  HasDomain: !Not [!Equals [!Ref DomainName, '']]\n  HasBackendImage: !Not [!Equals [!Ref BackendImageURI, '']]\n  HasFrontendImage: !Not [!Equals [!Ref FrontendImageURI, '']]\n  UseCloudFront: !Equals [!Ref EnableCloudFront, 'true']\n  UseAutoScaling: !Equals [!Ref EnableAutoScaling, 'true']\n  IsProduction: !Equals [!Ref Environment, 'production']\n  NoCertificate: !Equals [!Ref CertificateArn, '']\n\nMetadata:\n  AWS::CloudFormation::Interface:\n    ParameterGroups:\n      - Label:\n          default: Environment Configuration\n        Parameters:\n          - Environment\n          - DomainName\n      - Label:\n          default: Database Configuration\n        Parameters:\n          - DBUsername\n          - DBPassword\n          - DBName\n          - DBInstanceClass\n          - DBAllocatedStorage\n      - Label:\n          default: Application Security\n        Parameters:\n          - JWTSecret\n          - BankInfoEncryptionKey\n      - Label:\n          default: Container Images\n        Parameters:\n          - BackendImageURI\n          - FrontendImageURI\n      - Label:\n          default: ECS Configuration\n        Parameters:\n          - DesiredCount\n          - BackendCPU\n          - BackendMemory\n          - FrontendCPU\n          - FrontendMemory\n      - Label:\n          default: Scaling Configuration\n        Parameters:\n          - EnableAutoScaling\n          - MinTasks\n          - MaxTasks\n      - Label:\n          default: SSL/CDN Configuration\n        Parameters:\n          - CertificateArn\n          - EnableCloudFront\n\nResources:\n  # ==========================================\n  # VPC and Network Configuration\n  # ==========================================\n  VPC:\n    Type: AWS::EC2::VPC\n    Properties:\n      CidrBlock: 10.0.0.0/16\n      EnableDnsHostnames: true\n      EnableDnsSupport: true\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-vpc\n        - Key: Environment\n          Value: !Ref Environment\n\n  InternetGateway:\n    Type: AWS::EC2::InternetGateway\n    Properties:\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-igw\n\n  AttachGateway:\n    Type: AWS::EC2::VPCGatewayAttachment\n    Properties:\n      VpcId: !Ref VPC\n      InternetGatewayId: !Ref InternetGateway\n\n  # Public Subnets\n  PublicSubnet1:\n    Type: AWS::EC2::Subnet\n    Properties:\n      VpcId: !Ref VPC\n      CidrBlock: 10.0.1.0/24\n      AvailabilityZone: !Select [0, !GetAZs '']\n      MapPublicIpOnLaunch: true\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-public-subnet-1\n\n  PublicSubnet2:\n    Type: AWS::EC2::Subnet\n    Properties:\n      VpcId: !Ref VPC\n      CidrBlock: 10.0.2.0/24\n      AvailabilityZone: !Select [1, !GetAZs '']\n      MapPublicIpOnLaunch: true\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-public-subnet-2\n\n  # Private Subnets\n  PrivateSubnet1:\n    Type: AWS::EC2::Subnet\n    Properties:\n      VpcId: !Ref VPC\n      CidrBlock: 10.0.11.0/24\n      AvailabilityZone: !Select [0, !GetAZs '']\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-private-subnet-1\n\n  PrivateSubnet2:\n    Type: AWS::EC2::Subnet\n    Properties:\n      VpcId: !Ref VPC\n      CidrBlock: 10.0.12.0/24\n      AvailabilityZone: !Select [1, !GetAZs '']\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-private-subnet-2\n\n  # NAT Gateways for private subnets\n  NATGateway1EIP:\n    Type: AWS::EC2::EIP\n    DependsOn: AttachGateway\n    Properties:\n      Domain: vpc\n\n  NATGateway2EIP:\n    Type: AWS::EC2::EIP\n    DependsOn: AttachGateway\n    Properties:\n      Domain: vpc\n\n  NATGateway1:\n    Type: AWS::EC2::NatGateway\n    Properties:\n      AllocationId: !GetAtt NATGateway1EIP.AllocationId\n      SubnetId: !Ref PublicSubnet1\n\n  NATGateway2:\n    Type: AWS::EC2::NatGateway\n    Properties:\n      AllocationId: !GetAtt NATGateway2EIP.AllocationId\n      SubnetId: !Ref PublicSubnet2\n\n  # Route Tables\n  PublicRouteTable:\n    Type: AWS::EC2::RouteTable\n    Properties:\n      VpcId: !Ref VPC\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-public-rt\n\n  DefaultPublicRoute:\n    Type: AWS::EC2::Route\n    DependsOn: AttachGateway\n    Properties:\n      RouteTableId: !Ref PublicRouteTable\n      DestinationCidrBlock: 0.0.0.0/0\n      GatewayId: !Ref InternetGateway\n\n  PublicSubnet1RouteTableAssociation:\n    Type: AWS::EC2::SubnetRouteTableAssociation\n    Properties:\n      RouteTableId: !Ref PublicRouteTable\n      SubnetId: !Ref PublicSubnet1\n\n  PublicSubnet2RouteTableAssociation:\n    Type: AWS::EC2::SubnetRouteTableAssociation\n    Properties:\n      RouteTableId: !Ref PublicRouteTable\n      SubnetId: !Ref PublicSubnet2\n\n  PrivateRouteTable1:\n    Type: AWS::EC2::RouteTable\n    Properties:\n      VpcId: !Ref VPC\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-private-rt-1\n\n  DefaultPrivateRoute1:\n    Type: AWS::EC2::Route\n    Properties:\n      RouteTableId: !Ref PrivateRouteTable1\n      DestinationCidrBlock: 0.0.0.0/0\n      NatGatewayId: !Ref NATGateway1\n\n  PrivateSubnet1RouteTableAssociation:\n    Type: AWS::EC2::SubnetRouteTableAssociation\n    Properties:\n      RouteTableId: !Ref PrivateRouteTable1\n      SubnetId: !Ref PrivateSubnet1\n\n  PrivateRouteTable2:\n    Type: AWS::EC2::RouteTable\n    Properties:\n      VpcId: !Ref VPC\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-private-rt-2\n\n  DefaultPrivateRoute2:\n    Type: AWS::EC2::Route\n    Properties:\n      RouteTableId: !Ref PrivateRouteTable2\n      DestinationCidrBlock: 0.0.0.0/0\n      NatGatewayId: !Ref NATGateway2\n\n  PrivateSubnet2RouteTableAssociation:\n    Type: AWS::EC2::SubnetRouteTableAssociation\n    Properties:\n      RouteTableId: !Ref PrivateRouteTable2\n      SubnetId: !Ref PrivateSubnet2\n\n  # ==========================================\n  # Security Groups\n  # ==========================================\n  ALBSecurityGroup:\n    Type: AWS::EC2::SecurityGroup\n    Properties:\n      GroupDescription: Security group for Application Load Balancer\n      VpcId: !Ref VPC\n      SecurityGroupIngress:\n        - IpProtocol: tcp\n          FromPort: 80\n          ToPort: 80\n          CidrIp: 0.0.0.0/0\n          Description: Allow HTTP from anywhere\n        - IpProtocol: tcp\n          FromPort: 443\n          ToPort: 443\n          CidrIp: 0.0.0.0/0\n          Description: Allow HTTPS from anywhere\n      SecurityGroupEgress:\n        - IpProtocol: -1\n          CidrIp: 0.0.0.0/0\n          Description: Allow all outbound traffic\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-alb-sg\n\n  ECSSecurityGroup:\n    Type: AWS::EC2::SecurityGroup\n    Properties:\n      GroupDescription: Security group for ECS tasks\n      VpcId: !Ref VPC\n      SecurityGroupIngress:\n        # Allow backend traffic from ALB\n        - IpProtocol: tcp\n          FromPort: 8080\n          ToPort: 8080\n          SourceSecurityGroupId: !Ref ALBSecurityGroup\n          Description: Allow backend traffic from ALB\n        # Allow frontend traffic from ALB\n        - IpProtocol: tcp\n          FromPort: 80\n          ToPort: 80\n          SourceSecurityGroupId: !Ref ALBSecurityGroup\n          Description: Allow frontend traffic from ALB\n      SecurityGroupEgress:\n        - IpProtocol: -1\n          CidrIp: 0.0.0.0/0\n          Description: Allow all outbound traffic\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-ecs-sg\n\n  # Service-to-service communication rules (must be separate resources)\n  ECSSecurityGroupIngressBackend:\n    Type: AWS::EC2::SecurityGroupIngress\n    Properties:\n      GroupId: !Ref ECSSecurityGroup\n      IpProtocol: tcp\n      FromPort: 8080\n      ToPort: 8080\n      SourceSecurityGroupId: !Ref ECSSecurityGroup\n      Description: Allow backend service-to-service communication\n\n  ECSSecurityGroupIngressFrontend:\n    Type: AWS::EC2::SecurityGroupIngress\n    Properties:\n      GroupId: !Ref ECSSecurityGroup\n      IpProtocol: tcp\n      FromPort: 80\n      ToPort: 80\n      SourceSecurityGroupId: !Ref ECSSecurityGroup\n      Description: Allow frontend service-to-service communication\n\n  RDSSecurityGroup:\n    Type: AWS::EC2::SecurityGroup\n    Properties:\n      GroupDescription: Security group for RDS PostgreSQL\n      VpcId: !Ref VPC\n      SecurityGroupIngress:\n        - IpProtocol: tcp\n          FromPort: 5432\n          ToPort: 5432\n          SourceSecurityGroupId: !Ref ECSSecurityGroup\n          Description: Allow PostgreSQL from ECS tasks\n      SecurityGroupEgress:\n        - IpProtocol: -1\n          CidrIp: 0.0.0.0/0\n          Description: Allow all outbound traffic\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-rds-sg\n\n  # ==========================================\n  # S3 Buckets\n  # ==========================================\n  DocumentsBucket:\n    Type: AWS::S3::Bucket\n    Properties:\n      BucketName: !Sub ${AWS::StackName}-documents-${AWS::AccountId}\n      BucketEncryption:\n        ServerSideEncryptionConfiguration:\n          - ServerSideEncryptionByDefault:\n              SSEAlgorithm: AES256\n      VersioningConfiguration:\n        Status: Enabled\n      PublicAccessBlockConfiguration:\n        BlockPublicAcls: true\n        BlockPublicPolicy: true\n        IgnorePublicAcls: true\n        RestrictPublicBuckets: true\n      LifecycleConfiguration:\n        Rules:\n          - Id: DeleteOldVersions\n            Status: Enabled\n            NoncurrentVersionExpirationInDays: 90\n      CorsConfiguration:\n        CorsRules:\n          - AllowedHeaders: ['*']\n            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]\n            AllowedOrigins: ['*']\n            MaxAge: 3000\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-documents\n        - Key: Environment\n          Value: !Ref Environment\n\n  ResumesBucket:\n    Type: AWS::S3::Bucket\n    Properties:\n      BucketName: !Sub ${AWS::StackName}-resumes-${AWS::AccountId}\n      BucketEncryption:\n        ServerSideEncryptionConfiguration:\n          - ServerSideEncryptionByDefault:\n              SSEAlgorithm: AES256\n      PublicAccessBlockConfiguration:\n        BlockPublicAcls: true\n        BlockPublicPolicy: true\n        IgnorePublicAcls: true\n        RestrictPublicBuckets: true\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-resumes\n\n  # ==========================================\n  # DynamoDB Tables\n  # ==========================================\n  BackgroundCheckTable:\n    Type: AWS::DynamoDB::Table\n    Properties:\n      TableName: !Sub ${AWS::StackName}-background-checks\n      BillingMode: PAY_PER_REQUEST\n      AttributeDefinitions:\n        - AttributeName: id\n          AttributeType: S\n        - AttributeName: employee_id\n          AttributeType: S\n        - AttributeName: status\n          AttributeType: S\n      KeySchema:\n        - AttributeName: id\n          KeyType: HASH\n      GlobalSecondaryIndexes:\n        - IndexName: employee-index\n          KeySchema:\n            - AttributeName: employee_id\n              KeyType: HASH\n          Projection:\n            ProjectionType: ALL\n        - IndexName: status-index\n          KeySchema:\n            - AttributeName: status\n              KeyType: HASH\n          Projection:\n            ProjectionType: ALL\n      StreamSpecification:\n        StreamViewType: NEW_AND_OLD_IMAGES\n      PointInTimeRecoverySpecification:\n        PointInTimeRecoveryEnabled: !If [IsProduction, true, false]\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-bgchecks\n        - Key: Environment\n          Value: !Ref Environment\n\n  # ==========================================\n  # RDS PostgreSQL Database\n  # ==========================================\n  DBSubnetGroup:\n    Type: AWS::RDS::DBSubnetGroup\n    Properties:\n      DBSubnetGroupDescription: Subnet group for RDS\n      SubnetIds:\n        - !Ref PrivateSubnet1\n        - !Ref PrivateSubnet2\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-db-subnet-group\n\n  RDSInstance:\n    Type: AWS::RDS::DBInstance\n    DeletionPolicy: Snapshot\n    UpdateReplacePolicy: Snapshot\n    Properties:\n      DBInstanceIdentifier: !Sub ${AWS::StackName}-postgres\n      Engine: postgres\n      EngineVersion: '16.6'\n      DBInstanceClass: !Ref DBInstanceClass\n      AllocatedStorage: !Ref DBAllocatedStorage\n      StorageType: gp3\n      StorageEncrypted: true\n      MasterUsername: !Ref DBUsername\n      MasterUserPassword: !Ref DBPassword\n      DBName: !Ref DBName\n      VPCSecurityGroups:\n        - !Ref RDSSecurityGroup\n      DBSubnetGroupName: !Ref DBSubnetGroup\n      PubliclyAccessible: false\n      MultiAZ: !If [IsProduction, true, false]\n      BackupRetentionPeriod: !If [IsProduction, 7, 1]\n      PreferredBackupWindow: '03:00-04:00'\n      PreferredMaintenanceWindow: 'sun:04:00-sun:05:00'\n      EnableCloudwatchLogsExports:\n        - postgresql\n      DeletionProtection: !If [IsProduction, true, false]\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-postgres\n        - Key: Environment\n          Value: !Ref Environment\n\n  # ==========================================\n  # Application Load Balancer\n  # ==========================================\n  ApplicationLoadBalancer:\n    Type: AWS::ElasticLoadBalancingV2::LoadBalancer\n    Properties:\n      Name: !Sub ${AWS::StackName}-alb\n      Scheme: internet-facing\n      Type: application\n      IpAddressType: ipv4\n      Subnets:\n        - !Ref PublicSubnet1\n        - !Ref PublicSubnet2\n      SecurityGroups:\n        - !Ref ALBSecurityGroup\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-alb\n\n  # Backend Target Group\n  BackendTargetGroup:\n    Type: AWS::ElasticLoadBalancingV2::TargetGroup\n    Properties:\n      Name: !Sub ${AWS::StackName}-backend-tg\n      Port: 8080\n      Protocol: HTTP\n      TargetType: ip\n      VpcId: !Ref VPC\n      HealthCheckEnabled: true\n      HealthCheckPath: /api/health\n      HealthCheckProtocol: HTTP\n      HealthCheckIntervalSeconds: 30\n      HealthCheckTimeoutSeconds: 10\n      HealthyThresholdCount: 2\n      UnhealthyThresholdCount: 5\n      Matcher:\n        HttpCode: 200-399\n      TargetGroupAttributes:\n        - Key: deregistration_delay.timeout_seconds\n          Value: '30'\n        - Key: stickiness.enabled\n          Value: 'true'\n        - Key: stickiness.type\n          Value: lb_cookie\n        - Key: stickiness.lb_cookie.duration_seconds\n          Value: '86400'\n\n  # Frontend Target Group\n  FrontendTargetGroup:\n    Type: AWS::ElasticLoadBalancingV2::TargetGroup\n    Properties:\n      Name: !Sub ${AWS::StackName}-frontend-tg\n      Port: 80\n      Protocol: HTTP\n      TargetType: ip\n      VpcId: !Ref VPC\n      HealthCheckEnabled: true\n      HealthCheckPath: /\n      HealthCheckProtocol: HTTP\n      HealthCheckIntervalSeconds: 30\n      HealthCheckTimeoutSeconds: 10\n      HealthyThresholdCount: 2\n      UnhealthyThresholdCount: 5\n      Matcher:\n        HttpCode: 200-399\n      TargetGroupAttributes:\n        - Key: deregistration_delay.timeout_seconds\n          Value: '30'\n\n  # HTTPS Listener (if certificate provided)\n  HTTPSListener:\n    Type: AWS::ElasticLoadBalancingV2::Listener\n    Condition: HasCertificate\n    Properties:\n      LoadBalancerArn: !Ref ApplicationLoadBalancer\n      Port: 443\n      Protocol: HTTPS\n      Certificates:\n        - CertificateArn: !Ref CertificateArn\n      DefaultActions:\n        - Type: forward\n          TargetGroupArn: !Ref FrontendTargetGroup\n\n  # HTTP Listener\n  HTTPListener:\n    Type: AWS::ElasticLoadBalancingV2::Listener\n    Properties:\n      LoadBalancerArn: !Ref ApplicationLoadBalancer\n      Port: 80\n      Protocol: HTTP\n      DefaultActions:\n        - !If\n          - HasCertificate\n          - Type: redirect\n            RedirectConfig:\n              Protocol: HTTPS\n              Port: '443'\n              StatusCode: HTTP_301\n          - Type: forward\n            TargetGroupArn: !Ref FrontendTargetGroup\n\n  # API path rule (both HTTP and HTTPS)\n  HTTPSBackendRule:\n    Type: AWS::ElasticLoadBalancingV2::ListenerRule\n    Condition: HasCertificate\n    Properties:\n      ListenerArn: !Ref HTTPSListener\n      Priority: 1\n      Conditions:\n        - Field: path-pattern\n          Values:\n            - '/api/*'\n      Actions:\n        - Type: forward\n          TargetGroupArn: !Ref BackendTargetGroup\n\n  HTTPBackendRule:\n    Type: AWS::ElasticLoadBalancingV2::ListenerRule\n    Condition: HasCertificate\n    Properties:\n      ListenerArn: !Ref HTTPListener\n      Priority: 1\n      Conditions:\n        - Field: path-pattern\n          Values:\n            - '/api/*'\n      Actions:\n        - Type: redirect\n          RedirectConfig:\n            Protocol: HTTPS\n            Port: '443'\n            StatusCode: HTTP_301\n\n  HTTPBackendRuleNoCert:\n    Type: AWS::ElasticLoadBalancingV2::ListenerRule\n    Condition: NoCertificate\n    Properties:\n      ListenerArn: !Ref HTTPListener\n      Priority: 1\n      Conditions:\n        - Field: path-pattern\n          Values:\n            - '/api/*'\n      Actions:\n        - Type: forward\n          TargetGroupArn: !Ref BackendTargetGroup\n\n  # ==========================================\n  # ECS Cluster\n  # ==========================================\n  ECSCluster:\n    Type: AWS::ECS::Cluster\n    Properties:\n      ClusterName: !Sub ${AWS::StackName}-cluster\n      CapacityProviders:\n        - FARGATE\n        - FARGATE_SPOT\n      DefaultCapacityProviderStrategy:\n        - CapacityProvider: FARGATE\n          Weight: 1\n          Base: 1\n        - CapacityProvider: FARGATE_SPOT\n          Weight: !If [IsProduction, 0, 1]\n      ClusterSettings:\n        - Name: containerInsights\n          Value: enabled\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-cluster\n\n  # ==========================================\n  # IAM Roles\n  # ==========================================\n  ECSTaskExecutionRole:\n    Type: AWS::IAM::Role\n    Properties:\n      AssumeRolePolicyDocument:\n        Statement:\n          - Effect: Allow\n            Principal:\n              Service: ecs-tasks.amazonaws.com\n            Action: sts:AssumeRole\n      ManagedPolicyArns:\n        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy\n      Policies:\n        - PolicyName: SecretsManagerAccess\n          PolicyDocument:\n            Version: '2012-10-17'\n            Statement:\n              - Effect: Allow\n                Action:\n                  - secretsmanager:GetSecretValue\n                Resource: '*'\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-ecs-execution-role\n\n  ECSTaskRole:\n    Type: AWS::IAM::Role\n    Properties:\n      AssumeRolePolicyDocument:\n        Statement:\n          - Effect: Allow\n            Principal:\n              Service: ecs-tasks.amazonaws.com\n            Action: sts:AssumeRole\n      Policies:\n        - PolicyName: S3Access\n          PolicyDocument:\n            Version: '2012-10-17'\n            Statement:\n              - Effect: Allow\n                Action:\n                  - s3:GetObject\n                  - s3:PutObject\n                  - s3:DeleteObject\n                  - s3:ListBucket\n                Resource:\n                  - !GetAtt DocumentsBucket.Arn\n                  - !Sub ${DocumentsBucket.Arn}/*\n                  - !GetAtt ResumesBucket.Arn\n                  - !Sub ${ResumesBucket.Arn}/*\n        - PolicyName: DynamoDBAccess\n          PolicyDocument:\n            Version: '2012-10-17'\n            Statement:\n              - Effect: Allow\n                Action:\n                  - dynamodb:PutItem\n                  - dynamodb:GetItem\n                  - dynamodb:UpdateItem\n                  - dynamodb:DeleteItem\n                  - dynamodb:Query\n                  - dynamodb:Scan\n                Resource:\n                  - !GetAtt BackgroundCheckTable.Arn\n                  - !Sub ${BackgroundCheckTable.Arn}/index/*\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-ecs-task-role\n\n  # ==========================================\n  # CloudWatch Log Groups\n  # ==========================================\n  BackendLogGroup:\n    Type: AWS::Logs::LogGroup\n    Properties:\n      LogGroupName: !Sub /ecs/${AWS::StackName}/backend\n      RetentionInDays: !If [IsProduction, 30, 7]\n\n  FrontendLogGroup:\n    Type: AWS::Logs::LogGroup\n    Properties:\n      LogGroupName: !Sub /ecs/${AWS::StackName}/frontend\n      RetentionInDays: !If [IsProduction, 30, 7]\n\n  # ==========================================\n  # ECS Task Definitions\n  # ==========================================\n  BackendTaskDefinition:\n    Type: AWS::ECS::TaskDefinition\n    Properties:\n      Family: !Sub ${AWS::StackName}-backend\n      NetworkMode: awsvpc\n      RequiresCompatibilities:\n        - FARGATE\n      Cpu: !Ref BackendCPU\n      Memory: !Ref BackendMemory\n      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn\n      TaskRoleArn: !GetAtt ECSTaskRole.Arn\n      ContainerDefinitions:\n        - Name: backend\n          Image: !If\n            - HasBackendImage\n            - !Ref BackendImageURI\n            - 'public.ecr.aws/docker/library/golang:1.21-alpine'\n          Essential: true\n          PortMappings:\n            - ContainerPort: 8080\n              Protocol: tcp\n          Environment:\n            - Name: PORT\n              Value: '8080'\n            - Name: ENVIRONMENT\n              Value: !Ref Environment\n            - Name: DB_HOST\n              Value: !GetAtt RDSInstance.Endpoint.Address\n            - Name: DB_PORT\n              Value: '5432'\n            - Name: DB_NAME\n              Value: !Ref DBName\n            - Name: DB_USER\n              Value: !Ref DBUsername\n            - Name: DB_PASSWORD\n              Value: !Ref DBPassword\n            - Name: JWT_SECRET\n              Value: !Ref JWTSecret\n            - Name: BANK_INFO_ENCRYPTION_KEY\n              Value: !Ref BankInfoEncryptionKey\n            - Name: AWS_REGION\n              Value: !Ref AWS::Region\n            - Name: S3_BUCKET\n              Value: !Ref DocumentsBucket\n            - Name: DYNAMODB_BGCHECK_TABLE_NAME\n              Value: !Ref BackgroundCheckTable\n            - Name: FRONTEND_URL\n              Value: !If\n                - HasDomain\n                - !Sub https://${DomainName}\n                - !Sub http://${ApplicationLoadBalancer.DNSName}\n          LogConfiguration:\n            LogDriver: awslogs\n            Options:\n              awslogs-group: !Ref BackendLogGroup\n              awslogs-region: !Ref AWS::Region\n              awslogs-stream-prefix: ecs\n          HealthCheck:\n            Command:\n              - CMD-SHELL\n              - wget -q --spider http://localhost:8080/api/health || exit 1\n            Interval: 30\n            Timeout: 5\n            Retries: 3\n            StartPeriod: 60\n\n  FrontendTaskDefinition:\n    Type: AWS::ECS::TaskDefinition\n    Properties:\n      Family: !Sub ${AWS::StackName}-frontend\n      NetworkMode: awsvpc\n      RequiresCompatibilities:\n        - FARGATE\n      Cpu: !Ref FrontendCPU\n      Memory: !Ref FrontendMemory\n      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn\n      TaskRoleArn: !GetAtt ECSTaskRole.Arn\n      ContainerDefinitions:\n        - Name: frontend\n          Image: !If\n            - HasFrontendImage\n            - !Ref FrontendImageURI\n            - 'nginx:alpine'\n          Essential: true\n          PortMappings:\n            - ContainerPort: 80\n              Protocol: tcp\n          Environment:\n            - Name: BACKEND_URL\n              Value: !Sub http://${ApplicationLoadBalancer.DNSName}\n          LogConfiguration:\n            LogDriver: awslogs\n            Options:\n              awslogs-group: !Ref FrontendLogGroup\n              awslogs-region: !Ref AWS::Region\n              awslogs-stream-prefix: ecs\n          HealthCheck:\n            Command:\n              - CMD-SHELL\n              - \"curl -f http://localhost/ || exit 1\"\n            Interval: 30\n            Timeout: 10\n            Retries: 3\n            StartPeriod: 120\n\n  # ==========================================\n  # ECS Services\n  # ==========================================\n  BackendService:\n    Type: AWS::ECS::Service\n    DependsOn:\n      - HTTPListener\n    Properties:\n      ServiceName: !Sub ${AWS::StackName}-backend\n      Cluster: !Ref ECSCluster\n      TaskDefinition: !Ref BackendTaskDefinition\n      DesiredCount: !Ref DesiredCount\n      LaunchType: FARGATE\n      NetworkConfiguration:\n        AwsvpcConfiguration:\n          AssignPublicIp: DISABLED\n          SecurityGroups:\n            - !Ref ECSSecurityGroup\n          Subnets:\n            - !Ref PrivateSubnet1\n            - !Ref PrivateSubnet2\n      LoadBalancers:\n        - ContainerName: backend\n          ContainerPort: 8080\n          TargetGroupArn: !Ref BackendTargetGroup\n      HealthCheckGracePeriodSeconds: 180\n      DeploymentConfiguration:\n        MaximumPercent: 200\n        MinimumHealthyPercent: 100\n        DeploymentCircuitBreaker:\n          Enable: true\n          Rollback: true\n      EnableECSManagedTags: true\n      PropagateTags: SERVICE\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-backend-service\n\n  FrontendService:\n    Type: AWS::ECS::Service\n    DependsOn:\n      - HTTPListener\n      - BackendService\n    Properties:\n      ServiceName: !Sub ${AWS::StackName}-frontend\n      Cluster: !Ref ECSCluster\n      TaskDefinition: !Ref FrontendTaskDefinition\n      DesiredCount: !Ref DesiredCount\n      LaunchType: FARGATE\n      NetworkConfiguration:\n        AwsvpcConfiguration:\n          AssignPublicIp: DISABLED\n          SecurityGroups:\n            - !Ref ECSSecurityGroup\n          Subnets:\n            - !Ref PrivateSubnet1\n            - !Ref PrivateSubnet2\n      LoadBalancers:\n        - ContainerName: frontend\n          ContainerPort: 80\n          TargetGroupArn: !Ref FrontendTargetGroup\n      HealthCheckGracePeriodSeconds: 180\n      DeploymentConfiguration:\n        MaximumPercent: 200\n        MinimumHealthyPercent: 100\n        DeploymentCircuitBreaker:\n          Enable: true\n          Rollback: true\n      EnableECSManagedTags: true\n      PropagateTags: SERVICE\n      Tags:\n        - Key: Name\n          Value: !Sub ${AWS::StackName}-frontend-service\n\n  # ==========================================\n  # Auto Scaling (Optional)\n  # ==========================================\n  BackendAutoScalingTarget:\n    Type: AWS::ApplicationAutoScaling::ScalableTarget\n    Condition: UseAutoScaling\n    Properties:\n      MaxCapacity: !Ref MaxTasks\n      MinCapacity: !Ref MinTasks\n      ResourceId: !Sub service/${ECSCluster}/${BackendService.Name}\n      RoleARN: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService\n      ScalableDimension: ecs:service:DesiredCount\n      ServiceNamespace: ecs\n\n  BackendScalingPolicyCPU:\n    Type: AWS::ApplicationAutoScaling::ScalingPolicy\n    Condition: UseAutoScaling\n    Properties:\n      PolicyName: !Sub ${AWS::StackName}-backend-cpu-scaling\n      PolicyType: TargetTrackingScaling\n      ScalingTargetId: !Ref BackendAutoScalingTarget\n      TargetTrackingScalingPolicyConfiguration:\n        TargetValue: 70.0\n        PredefinedMetricSpecification:\n          PredefinedMetricType: ECSServiceAverageCPUUtilization\n        ScaleInCooldown: 300\n        ScaleOutCooldown: 60\n\n  BackendScalingPolicyMemory:\n    Type: AWS::ApplicationAutoScaling::ScalingPolicy\n    Condition: UseAutoScaling\n    Properties:\n      PolicyName: !Sub ${AWS::StackName}-backend-memory-scaling\n      PolicyType: TargetTrackingScaling\n      ScalingTargetId: !Ref BackendAutoScalingTarget\n      TargetTrackingScalingPolicyConfiguration:\n        TargetValue: 80.0\n        PredefinedMetricSpecification:\n          PredefinedMetricType: ECSServiceAverageMemoryUtilization\n        ScaleInCooldown: 300\n        ScaleOutCooldown: 60\n\n  # ==========================================\n  # CloudWatch Alarms\n  # ==========================================\n  HighCPUAlarm:\n    Type: AWS::CloudWatch::Alarm\n    Properties:\n      AlarmName: !Sub ${AWS::StackName}-backend-high-cpu\n      AlarmDescription: Alert when backend CPU exceeds 80%\n      MetricName: CPUUtilization\n      Namespace: AWS/ECS\n      Statistic: Average\n      Period: 300\n      EvaluationPeriods: 2\n      Threshold: 80\n      ComparisonOperator: GreaterThanThreshold\n      Dimensions:\n        - Name: ServiceName\n          Value: !GetAtt BackendService.Name\n        - Name: ClusterName\n          Value: !Ref ECSCluster\n\n  HighMemoryAlarm:\n    Type: AWS::CloudWatch::Alarm\n    Properties:\n      AlarmName: !Sub ${AWS::StackName}-backend-high-memory\n      AlarmDescription: Alert when backend memory exceeds 85%\n      MetricName: MemoryUtilization\n      Namespace: AWS/ECS\n      Statistic: Average\n      Period: 300\n      EvaluationPeriods: 2\n      Threshold: 85\n      ComparisonOperator: GreaterThanThreshold\n      Dimensions:\n        - Name: ServiceName\n          Value: !GetAtt BackendService.Name\n        - Name: ClusterName\n          Value: !Ref ECSCluster\n\n  DatabaseConnectionsAlarm:\n    Type: AWS::CloudWatch::Alarm\n    Properties:\n      AlarmName: !Sub ${AWS::StackName}-db-high-connections\n      AlarmDescription: Alert when database connections exceed 80% of max\n      MetricName: DatabaseConnections\n      Namespace: AWS/RDS\n      Statistic: Average\n      Period: 300\n      EvaluationPeriods: 2\n      Threshold: 80\n      ComparisonOperator: GreaterThanThreshold\n      Dimensions:\n        - Name: DBInstanceIdentifier\n          Value: !Ref RDSInstance\n\nOutputs:\n  VPCId:\n    Description: VPC ID\n    Value: !Ref VPC\n    Export:\n      Name: !Sub ${AWS::StackName}-VPC\n\n  ApplicationURL:\n    Description: Application URL\n    Value: !If\n      - HasCertificate\n      - !Sub https://${ApplicationLoadBalancer.DNSName}\n      - !Sub http://${ApplicationLoadBalancer.DNSName}\n\n  ALBDNSName:\n    Description: ALB DNS Name\n    Value: !GetAtt ApplicationLoadBalancer.DNSName\n    Export:\n      Name: !Sub ${AWS::StackName}-ALB-DNS\n\n  DatabaseEndpoint:\n    Description: RDS Endpoint\n    Value: !GetAtt RDSInstance.Endpoint.Address\n    Export:\n      Name: !Sub ${AWS::StackName}-DB-Endpoint\n\n  DocumentsBucketName:\n    Description: S3 Bucket for Documents\n    Value: !Ref DocumentsBucket\n    Export:\n      Name: !Sub ${AWS::StackName}-Documents-Bucket\n\n  ResumesBucketName:\n    Description: S3 Bucket for Resumes\n    Value: !Ref ResumesBucket\n    Export:\n      Name: !Sub ${AWS::StackName}-Resumes-Bucket\n\n  BackgroundCheckTableName:\n    Description: DynamoDB Table for Background Checks\n    Value: !Ref BackgroundCheckTable\n    Export:\n      Name: !Sub ${AWS::StackName}-BgCheck-Table\n\n  ECSClusterName:\n    Description: ECS Cluster Name\n    Value: !Ref ECSCluster\n    Export:\n      Name: !Sub ${AWS::StackName}-ECS-Cluster\n\n  BackendServiceName:\n    Description: Backend ECS Service Name\n    Value: !GetAtt BackendService.Name\n\n  FrontendServiceName:\n    Description: Frontend ECS Service Name\n    Value: !GetAtt FrontendService.Name\n"
